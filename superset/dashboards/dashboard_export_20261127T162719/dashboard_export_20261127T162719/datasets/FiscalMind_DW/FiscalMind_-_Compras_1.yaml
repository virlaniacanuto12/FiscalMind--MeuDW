catalog: fiscalmind_dw
schema: dw
sql: "\r\nSELECT\r\n    fc.id_compra,\r\n    fc.id_fornecedor,\r\n    fc.id_produto,\r\
  \n\r\n    -- TEMPO\r\n    t.data AS data_compra,\r\n    t.ano,\r\n    t.trimestre,\r\
  \n    t.mes,\r\n    t.nome_mes,\r\n\r\n    -- IDENTIFICA\xC7\xC3O DA NOTA\r\n  \
  \  CONCAT_WS(\r\n        '-',\r\n        f.documento,\r\n        fc.modelo,\r\n\
  \        fc.serie,\r\n        fc.numero_nota\r\n    ) AS nota,\r\n\r\n    -- FORNECEDOR\r\
  \n    f.documento AS documento_fornecedor,\r\n    f.nome AS fornecedor,\r\n    f.municipio\
  \ AS municipio_fornecedor,\r\n    f.uf AS uf_fornecedor,\r\n\r\n    CASE\r\n   \
  \     WHEN UPPER(TRIM(f.uf)) IN\r\n            ('AC','AM','AP','PA','RO','RR','TO')\r\
  \n            THEN 'Norte'\r\n        WHEN UPPER(TRIM(f.uf)) IN\r\n            ('AL','BA','CE','MA','PB','PE','PI','RN','SE')\r\
  \n            THEN 'Nordeste'\r\n        WHEN UPPER(TRIM(f.uf)) IN\r\n         \
  \   ('DF','GO','MS','MT')\r\n            THEN 'Centro-Oeste'\r\n        WHEN UPPER(TRIM(f.uf))\
  \ IN\r\n            ('ES','MG','RJ','SP')\r\n            THEN 'Sudeste'\r\n    \
  \    WHEN UPPER(TRIM(f.uf)) IN\r\n            ('PR','RS','SC')\r\n            THEN\
  \ 'Sul'\r\n        ELSE 'N\xE3o informado'\r\n    END AS regiao_fornecedor,\r\n\r\
  \n    -- PRODUTO\r\n    p.codigo_produto,\r\n    p.descricao_produto AS produto,\r\
  \n    p.codigo_barras,\r\n    p.unidade_comercial,\r\n    p.ncm,\r\n    LEFT(p.ncm,\
  \ 2) AS capitulo_ncm,\r\n    p.cest,\r\n\r\n    -- VALORES\r\n    fc.quantidade,\r\
  \n    fc.valor_unitario,\r\n    fc.valor_produto\r\n\r\nFROM dw.fato_compra AS fc\r\
  \n\r\nJOIN dw.dim_tempo AS t\r\n    ON fc.id_tempo = t.id_tempo\r\n\r\nJOIN dw.dim_fornecedor\
  \ AS f\r\n    ON fc.id_fornecedor = f.id_fornecedor\r\n\r\nJOIN dw.dim_produto AS\
  \ p\r\n    ON fc.id_produto = p.id_produto\r\n\r\n"
