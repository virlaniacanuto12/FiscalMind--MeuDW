sql: "-- BLOCO 1: valor comprado em cada semana (a semana come\xE7a na segunda-feira)\r\
  \nWITH compras_semana AS (\r\n    SELECT\r\n        DATE_TRUNC('week', t.data)::date\
  \ AS semana,\r\n        SUM(fc.valor_produto)            AS valor_compras\r\n  \
  \  FROM dw.fato_compra AS fc\r\n    JOIN dw.dim_tempo AS t\r\n        ON fc.id_tempo\
  \ = t.id_tempo\r\n    GROUP BY DATE_TRUNC('week', t.data)\r\n),\r\n\r\n-- BLOCO\
  \ 2: n\xFAmero da semana (0, 1, 2...) = eixo X da regress\xE3o\r\nnumeradas AS (\r\
  \n    SELECT\r\n        semana,\r\n        valor_compras,\r\n        (semana - MIN(semana)\
  \ OVER ()) / 7 AS numero_semana\r\n    FROM compras_semana\r\n)\r\n\r\n-- BLOCO\
  \ 3: reta de tend\xEAncia = ponto de partida + inclina\xE7\xE3o \xD7 semana\r\n\
  SELECT\r\n    semana,\r\n    numero_semana,\r\n    valor_compras,\r\n    ROUND((REGR_INTERCEPT(valor_compras,\
  \ numero_semana) OVER ()\r\n         + REGR_SLOPE(valor_compras, numero_semana)\
  \ OVER () * numero_semana\r\n          )::numeric, 2)                          \
  \               AS tendencia,\r\n    ROUND(REGR_SLOPE(valor_compras, numero_semana)\
  \ OVER ()::numeric, 2)\r\n                                                     \
  \            AS variacao_por_semana,\r\n    ROUND(REGR_R2(valor_compras, numero_semana)\
  \ OVER ()::numeric, 4)\r\n                                                     \
  \            AS r2\r\nFROM numeradas"
