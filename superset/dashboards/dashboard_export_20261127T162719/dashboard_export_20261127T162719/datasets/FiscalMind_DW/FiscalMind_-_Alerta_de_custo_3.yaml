sql: "-- BLOCO 1: quanto foi comprado de cada produto em cada m\xEAs\r\nWITH compras_mes\
  \ AS (\r\n    SELECT\r\n        fc.id_produto,\r\n        p.descricao_produto  \
  \             AS produto,\r\n        p.unidade_comercial,\r\n        LEFT(p.ncm,\
  \ 2)                    AS capitulo_ncm,\r\n        f.nome                     \
  \       AS fornecedor,\r\n        DATE_TRUNC('month', t.data)::date AS mes,\r\n\
  \        SUM(fc.quantidade)                AS quantidade,\r\n        SUM(fc.valor_produto)\
  \             AS valor\r\n    FROM dw.fato_compra AS fc\r\n    JOIN dw.dim_tempo\
  \ AS t\r\n        ON fc.id_tempo = t.id_tempo\r\n    JOIN dw.dim_fornecedor AS f\r\
  \n        ON fc.id_fornecedor = f.id_fornecedor\r\n    JOIN dw.dim_produto AS p\r\
  \n        ON fc.id_produto = p.id_produto\r\n    GROUP BY\r\n        fc.id_produto,\r\
  \n        p.descricao_produto,\r\n        p.unidade_comercial,\r\n        LEFT(p.ncm,\
  \ 2),\r\n        f.nome,\r\n        DATE_TRUNC('month', t.data)\r\n),\r\n\r\n--\
  \ BLOCO 2: custo do m\xEAs, custo da compra anterior e refer\xEAncias de volume\r\
  \ncustos AS (\r\n    SELECT\r\n        compras_mes.*,\r\n        valor / NULLIF(quantidade,\
  \ 0) AS custo_medio_mes,\r\n        LAG(valor / NULLIF(quantidade, 0)) OVER (\r\n\
  \            PARTITION BY id_produto\r\n            ORDER BY mes\r\n        ) AS\
  \ custo_compra_anterior,\r\n        AVG(quantidade) OVER (PARTITION BY id_produto)\
  \ AS quantidade_media_mensal,\r\n        COUNT(*)        OVER (PARTITION BY id_produto)\
  \ AS meses_com_compra\r\n    FROM compras_mes\r\n)\r\n\r\n-- BLOCO 3: varia\xE7\xF5\
  es e classifica\xE7\xE3o dos alertas\r\nSELECT\r\n    id_produto,\r\n    produto,\r\
  \n    unidade_comercial,\r\n    capitulo_ncm,\r\n    fornecedor,\r\n    mes,\r\n\
  \    quantidade,\r\n    valor,\r\n    ROUND(custo_medio_mes, 4)       AS custo_medio_mes,\r\
  \n    ROUND(custo_compra_anterior, 4) AS custo_compra_anterior,\r\n    ROUND(100\
  \ * (custo_medio_mes / NULLIF(custo_compra_anterior, 0) - 1), 2)\r\n           \
  \                         AS variacao_custo_pct,\r\n    CASE\r\n        WHEN custo_compra_anterior\
  \ IS NULL\r\n            THEN 'Sem compra anterior'\r\n        WHEN custo_medio_mes\
  \ >= custo_compra_anterior * 1.10\r\n            THEN 'Alta de custo'\r\n      \
  \  WHEN custo_medio_mes <= custo_compra_anterior * 0.90\r\n            THEN 'Queda\
  \ de custo'\r\n        ELSE 'Est\xE1vel'\r\n    END AS alerta_custo,\r\n    ROUND(quantidade_media_mensal,\
  \ 4)                         AS quantidade_media_mensal,\r\n    ROUND(quantidade\
  \ / NULLIF(quantidade_media_mensal, 0), 2) AS indice_volume,\r\n    meses_com_compra,\r\
  \n    CASE\r\n        WHEN meses_com_compra < 3\r\n            THEN 'Hist\xF3rico\
  \ insuficiente'\r\n        WHEN quantidade >= quantidade_media_mensal * 1.5\r\n\
  \            THEN 'Volume acima do normal'\r\n        WHEN quantidade <= quantidade_media_mensal\
  \ * 0.5\r\n            THEN 'Volume abaixo do normal'\r\n        ELSE 'Normal'\r\
  \n    END AS alerta_volume\r\nFROM custos"
