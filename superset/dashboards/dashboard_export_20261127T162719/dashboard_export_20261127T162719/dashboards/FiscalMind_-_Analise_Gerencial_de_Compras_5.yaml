description: null
css: "/* Fundo geral e cart\xF5es */\r\nbody,\r\n.dashboard,\r\n.dashboard-content,\r\
  \n.grid-container {\r\n  background-color: #0F1419 !important;\r\n  color: #F3F4F6\
  \ !important;\r\n}\r\n\r\n.dashboard-component-chart-holder,\r\n.dashboard-markdown\
  \ {\r\n  background-color: #161D26 !important;\r\n  border: 1px solid #232D3B !important;\r\
  \n  border-radius: 10px !important;\r\n  box-shadow: none !important;\r\n}\r\n\r\
  \n/* Cabe\xE7alho Markdown e t\xEDtulos dos cart\xF5es */\r\n.dashboard-markdown,\r\
  \n.dashboard-markdown p,\r\n.dashboard-markdown h1,\r\n.dashboard-markdown h2,\r\
  \n.dashboard-markdown h3,\r\n.dashboard-markdown span,\r\n.chart-header,\r\n.editable-title,\r\
  \n.editable-title a,\r\n.header-title {\r\n  color: #F9FAFB !important;\r\n}\r\n\
  \r\n/* KPIs (Big Number) - for\xE7a n\xFAmeros e subt\xEDtulos em branco/cinza claro\
  \ */\r\n.big-number-total .header-line,\r\n.big-number-total .header-line span,\r\
  \n.superset-legacy-chart-big-number .header-line,\r\n.echarts-big-number .header-line,\r\
  \n[data-test=\"big-number-header\"],\r\n.big_number_total text,\r\n.big_number text\
  \ {\r\n  color: #F9FAFB !important;\r\n  fill: #F9FAFB !important;\r\n}\r\n\r\n\
  .big-number-total .subheader-line,\r\n.big-number-total .subheader-line span,\r\n\
  .superset-legacy-chart-big-number .subheader-line,\r\n[data-test=\"big-number-subheader\"\
  ] {\r\n  color: #9CA3AF !important;\r\n  fill: #9CA3AF !important;\r\n}\r\n\r\n\
  /* Tabelas: elimina fundo branco de cabe\xE7alho, linhas zebradas e input Search\
  \ */\r\n.table-condensed,\r\ntable.table {\r\n  background-color: #161D26 !important;\r\
  \n  color: #E5E7EB !important;\r\n}\r\n\r\ntable.table thead tr,\r\ntable.table\
  \ thead th {\r\n  background-color: #1C2532 !important;\r\n  color: #9CA3AF !important;\r\
  \n  border-bottom: 1px solid #2D3748 !important;\r\n  border-top: none !important;\r\
  \n}\r\n\r\ntable.table tbody tr,\r\ntable.table tbody tr:nth-child(odd),\r\ntable.table\
  \ tbody tr:nth-child(even),\r\ntable.table tbody td {\r\n  background-color: #161D26\
  \ !important;\r\n  color: #F3F4F6 !important;\r\n  border-color: #232D3B !important;\r\
  \n}\r\n\r\ntable.table tbody tr:hover td {\r\n  background-color: #1E293B !important;\r\
  \n}\r\n\r\n/* Converte as Cell Bars das tabelas para o Amarelo/\xC2mbar (#FBBF24)\
  \ */\r\ntable.table tbody td[style*=\"linear-gradient\"] {\r\n  filter: hue-rotate(-95deg)\
  \ saturate(1.8) brightness(1.05) !important;\r\n}\r\n\r\n/* Campo Search e pagina\xE7\
  \xE3o das tabelas */\r\n.dt-controls input,\r\n.form-control,\r\ninput[type=\"search\"\
  ],\r\ninput[type=\"text\"] {\r\n  background-color: #0F1419 !important;\r\n  color:\
  \ #F3F4F6 !important;\r\n  border: 1px solid #2D3748 !important;\r\n}\r\n\r\n.dt-controls\
  \ label,\r\n.dt-pagination,\r\n.pagination > li > a,\r\n.pagination > li > span\
  \ {\r\n  background-color: #161D26 !important;\r\n  color: #9CA3AF !important;\r\
  \n  border-color: #232D3B !important;\r\n}\r\n\r\n/* Uniformiza o fundo e as bordas\
  \ da Pivot Table (Compras por regi\xE3o e m\xEAs) */\r\ntable.pvtTable,\r\ntable.pvtTable\
  \ thead th,\r\ntable.pvtTable tbody th,\r\ntable.pvtTable tbody td,\r\n.pvtAxisLabel,\r\
  \n.pvtColLabel,\r\n.pvtRowLabel,\r\n.pvtVal,\r\n.pvtTotal,\r\n.pvtGrandTotal {\r\
  \n  background-color: #161D26 !important;\r\n  border: 1px solid #232D3B !important;\r\
  \n  color: #E5E7EB !important;\r\n}\r\n\r\n/* Cabe\xE7alhos superiores e laterais\
  \ levemente diferenciados */\r\ntable.pvtTable thead th,\r\n.pvtAxisLabel,\r\n.pvtColLabel\
  \ {\r\n  background-color: #1C2532 !important;\r\n  color: #9CA3AF !important;\r\
  \n  font-weight: 600 !important;\r\n}\r\n\r\n/* Linha e coluna de Total (Sum) com\
  \ destaque sutil */\r\n.pvtTotal,\r\n.pvtGrandTotal {\r\n  background-color: #1A222D\
  \ !important;\r\n  color: #F9FAFB !important;\r\n  font-weight: 600 !important;\r\
  \n}\r\n\r\n/* Destaque ao passar o mouse na linha */\r\ntable.pvtTable tbody tr:hover\
  \ td,\r\ntable.pvtTable tbody tr:hover th {\r\n  background-color: #1E293B !important;\r\
  \n}\r\n\r\n/* Tenta atingir o elemento interno da barra proporcional dentro das\
  \ c\xE9lulas */\r\ntable.table tbody td > div[style*=\"background\"],\r\ntable.table\
  \ tbody td span[style*=\"background\"],\r\ntable.table tbody td div[class*=\"bar\"\
  ],\r\ntable.table tbody td span[class*=\"bar\"] {\r\n  filter: hue-rotate(-95deg)\
  \ saturate(1.8) brightness(1.05) !important;\r\n}"
